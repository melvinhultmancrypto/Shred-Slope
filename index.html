<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shred Slope</title>
  <meta name="description" content="Shred Slope: a snowboarding game you can play right in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="pill"><span id="dist">0</span><small>m</small></div>
      <div class="pill"><i class="coin-icon"></i><span id="coins">0</span></div>
    </div>
    <div class="hud-center">
      <div id="score">0</div>
      <div class="score-label">SCORE</div>
    </div>
    <div class="hud-right">
      <div class="pill"><small>BEST</small><span id="best">0</span></div>
      <div class="pill"><span id="speed">0</span><small>km/h</small></div>
    </div>
  </div>

  <div id="popup"></div>
  <div id="hint" class="hidden"></div>

  <!-- Title screen -->
  <section id="title" class="overlay">
    <div class="panel title-panel">
      <h1 class="logo"><span class="l1">SHRED</span><span class="l2">SLOPE</span></h1>
      <p class="tagline">Carve. Jump. Spin. Try not to eat a tree.</p>
      <button id="playBtn" class="btn" type="button">PLAY</button>
      <div class="keys">
        <div><kbd>&larr;</kbd><kbd>&rarr;</kbd> carve</div>
        <div><kbd>Space</kbd> jump</div>
        <div><kbd>&larr;</kbd><kbd>&rarr;</kbd> in the air: spin</div>
        <div><kbd>&darr;</kbd> in the air: grab</div>
      </div>
      <p class="small">Best score: <b id="titleBest">0</b></p>
    </div>
  </section>

  <!-- Game over screen -->
  <section id="over" class="overlay hidden">
    <div class="panel">
      <h2 class="wipe">WIPEOUT!</h2>
      <p id="reason" class="reason"></p>
      <div class="stats">
        <div><span>Distance</span><b id="oDist">0 m</b></div>
        <div><span>Coins</span><b id="oCoins">0</b></div>
        <div><span>Tricks</span><b id="oTricks">0</b></div>
        <div><span>Best</span><b id="oBest">0</b></div>
        <div class="total"><span>Score</span><b id="oScore">0</b></div>
      </div>
      <p id="newBest" class="newbest hidden">NEW BEST!</p>
      <div><button id="againBtn" class="btn" type="button">RIDE AGAIN</button></div>
      <p class="small dim">or press Space</p>
    </div>
  </section>

  <!-- Pause screen -->
  <section id="pause" class="overlay hidden">
    <div class="panel">
      <h2 class="paused">PAUSED</h2>
      <p class="small">Press P or Space to keep riding</p>
      <button id="resumeBtn" class="btn" type="button">RESUME</button>
    </div>
  </section>

  <div id="corner">
    <button id="pauseBtn" class="icon-btn hidden" type="button" title="Pause (P)">&#10073;&#10073;</button>
    <button id="muteBtn" class="icon-btn" type="button" title="Sound on/off (M)">&#128266;</button>
  </div>

  <!-- Touch controls (shown on phones/tablets) -->
  <div id="touch" class="hidden">
    <button data-k="left" type="button" aria-label="Carve left">&#9664;</button>
    <button data-k="jump" type="button" aria-label="Jump">JUMP</button>
    <button data-k="right" type="button" aria-label="Carve right">&#9654;</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
